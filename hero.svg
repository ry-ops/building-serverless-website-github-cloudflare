<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">Serverless website: push to live in one pipeline</title>
  <desc id="d">A commit pushed to GitHub triggers GitHub Actions, which runs astro build; the dist output deploys to Cloudflare Pages and the site goes live on Cloudflare's global network. A tutorial using Astro, GitHub Actions and Cloudflare Pages.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#ff5d01"/><stop offset=".5" stop-color="#f6821f"/><stop offset="1" stop-color="#ffb02e"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6ebf5; }
    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes p0 { 0%,5.56% { transform: translateX(120px); opacity:0 } 6.67% { opacity:1 } 18.89% { transform: translateX(360px); opacity:1 } 20.56%,100% { transform: translateX(360px); opacity:0 } } .p0 { animation: p0 9.0s infinite; }
    @keyframes p1 { 0%,23.33% { transform: translateX(360px); opacity:0 } 24.44% { opacity:1 } 36.67% { transform: translateX(600px); opacity:1 } 38.33%,100% { transform: translateX(600px); opacity:0 } } .p1 { animation: p1 9.0s infinite; }
    @keyframes p2 { 0%,41.11% { transform: translateX(600px); opacity:0 } 42.22% { opacity:1 } 54.44% { transform: translateX(840px); opacity:1 } 56.11%,100% { transform: translateX(840px); opacity:0 } } .p2 { animation: p2 9.0s infinite; }
    @keyframes s0 { 0%,5.56% { stroke-opacity:.3; } 7.78%,22.22% { stroke-opacity:1; } 25.56%,100% { stroke-opacity:.3; } } .s0 { animation: s0 9.0s infinite; }
    @keyframes s1 { 0%,23.33% { stroke-opacity:.3; } 25.56%,40.00% { stroke-opacity:1; } 43.33%,100% { stroke-opacity:.3; } } .s1 { animation: s1 9.0s infinite; }
    @keyframes s2 { 0%,41.11% { stroke-opacity:.3; } 43.33%,57.78% { stroke-opacity:1; } 61.11%,100% { stroke-opacity:.3; } } .s2 { animation: s2 9.0s infinite; }
    @keyframes s3 { 0%,58.89% { stroke-opacity:.3; } 61.11%,75.56% { stroke-opacity:1; } 78.89%,100% { stroke-opacity:.3; } } .s3 { animation: s3 9.0s infinite; }
    @keyframes live { 0%,72.22% { opacity:0; transform: scale(.7); } 76.67%,95.56% { opacity:1; transform: scale(1); } 100% { opacity:0; } } .live { animation: live 9.0s infinite; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="960" height="340" rx="20" fill="#0f1420"/>
  <text x="40" y="62" font-size="34" font-weight="800" style="fill:url(#title)">Serverless website</text>
  <text x="42" y="92" font-size="16" class="muted">Astro + GitHub Actions + Cloudflare Pages. Push to <tspan class="mono" style="fill:#e6ebf5">main</tspan>, and it's live.</text>
  <g class="s0"><rect x="64" y="150" width="112" height="70" rx="12" fill="#161d2b" stroke="#f6821f" stroke-width="2"/></g><text x="120" y="180" text-anchor="middle" font-size="13" font-weight="700">git</text><text x="120" y="200" text-anchor="middle" font-size="13" font-weight="700">push</text><line x1="176" y1="185" x2="304" y2="185" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/><g class="s1"><rect x="304" y="150" width="112" height="70" rx="12" fill="#161d2b" stroke="#7fba00" stroke-width="2"/></g><text x="360" y="180" text-anchor="middle" font-size="13" font-weight="700">GitHub</text><text x="360" y="200" text-anchor="middle" font-size="13" font-weight="700">Actions</text><line x1="416" y1="185" x2="544" y2="185" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/><g class="s2"><rect x="544" y="150" width="112" height="70" rx="12" fill="#161d2b" stroke="#ff5d01" stroke-width="2"/></g><text x="600" y="180" text-anchor="middle" font-size="13" font-weight="700">astro</text><text x="600" y="200" text-anchor="middle" font-size="13" font-weight="700">build</text><line x1="656" y1="185" x2="784" y2="185" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/><g class="s3"><rect x="784" y="150" width="112" height="70" rx="12" fill="#161d2b" stroke="#f6821f" stroke-width="2"/></g><text x="840" y="180" text-anchor="middle" font-size="13" font-weight="700">Cloudflare</text><text x="840" y="200" text-anchor="middle" font-size="13" font-weight="700">Pages</text>
  <g class="p0"><circle cx="0" cy="185" r="7" fill="#f6821f"/></g><g class="p1"><circle cx="0" cy="185" r="7" fill="#7fba00"/></g><g class="p2"><circle cx="0" cy="185" r="7" fill="#ff5d01"/></g>
  <g class="live">
    <circle cx="840" cy="268" r="26" fill="none" stroke="#f6821f" stroke-width="2"/>
    <ellipse cx="840" cy="268" rx="11" ry="26" fill="none" stroke="#f6821f" stroke-width="1.5"/>
    <line x1="814" y1="268" x2="866" y2="268" stroke="#f6821f" stroke-width="1.5"/>
    <text x="840" y="312" text-anchor="middle" font-size="12" font-weight="700" style="fill:#ffd88a">live on the edge</text>
  </g>
  
  <text x="360" y="256" text-anchor="middle" font-size="12" class="mono muted">npm run build</text>
  <text x="600" y="256" text-anchor="middle" font-size="12" class="mono muted">dist/</text>
</svg>
